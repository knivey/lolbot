# GameSurge — WHOX + vhost pattern engine + AuthServ (lifted limits).
# Driver is the owner's real account nick (vhost path needs the real
# account); SASL password goes in testenv/secrets.yaml, never here.
driver:
  # SASL does not exist on GameSurge — the bot and the driver both auth
  # via AuthServ AFTER welcome (Bot.onConnect). The committed profile
  # can't hold passwords: set `networks.0.bots.0.on_connect` (bot) and
  # `driver.on_connect` (client) in testenv/secrets.yaml — see
  # testenv/secrets.example.yaml.
  nick: devtester
networks:
  - name: gamesurge
    auth_engines: [vhost, whox, hostmask, manual]
    servers:
      - {address: irc.gamesurge.net, port: 6667, ssl: false}
    bots:
      - {name: lolbot-dev, trigger: ".", channels: ["#bots"]}
    # the vhost engine resolves the ACCOUNT label from the host
    # (lolbot-devclient.user.gamesurge) — the admin seed must be named
    # after the account, not the driver nick
    seed_users:
      - {name: lolbot-devclient, flags: [admin]}
