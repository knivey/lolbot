# Copy to testenv/secrets.yaml (gitignored) and fill per profile.
# Keys merge into the profile by name: `driver` keys merge onto the
# driver, `networks.<i>.bots.<j>` keys merge onto that bot.
ownnet: {}
gamesurge:
  # No SASL on GameSurge — auth is AuthServ AFTER welcome (001).
  # AUTHSERV is the server-side shortcut for
  # /msg AuthServ@Services.GameSurge.net
  driver:
    on_connect:
      - "AUTHSERV AUTH <your-account> <your-pass>"
  networks:
    "0":
      bots:
        "0":
          # the test bot's own AuthServ line (Bot.onConnect).
          # NOTE: the bot side takes a SINGLE string (multi-line via
          # embedded \n — BotManager explodes on newline), NOT a list.
          on_connect: "AUTHSERV AUTH <bot-account> <bot-pass>"
libera:
  driver:
    sasl_account: "<test-account>"
    sasl_pass: "<pass>"
    # NickServ fallback if SASL is unavailable for some reason:
    # on_connect:
    #   - "PRIVMSG NickServ :IDENTIFY <pass>"
all: {}
